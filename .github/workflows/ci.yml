name: ci

on:
  push:
  pull_request:

jobs:
  lint-sim-synth:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog verilator yosys
          pip install "cocotb>=2.0,<3" numpy
      - name: Lint
        run: make lint
      - name: Simulation (N = 2, 4, 8)
        run: make sim
      - name: Synthesis area sweep
        run: make synth
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            tb/coverage_N*.txt
            synth/reports/

  formal:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: YosysHQ/setup-oss-cad-suite@v3
      - name: Formal (SymbiYosys + yices)
        run: make formal
